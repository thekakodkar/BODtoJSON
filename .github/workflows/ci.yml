name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[api,dev]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest -v -p no:cacheprovider --cov=BODtoJSON --cov-report=term-missing

  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install core + pytest only
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pytest pytest-cov
      - name: Core tests without extras (mapper, parser, rules, mapping, reverse, CLI)
        # The optional FastAPI layer (api.py) cannot run without the [api] extra,
        # so it is left out of the coverage gate here; the full test job covers it.
        run: |
          printf '[run]\nsource = src/BODtoJSON\nomit = */BODtoJSON/api.py\n[report]\nfail_under = 90\nshow_missing = true\n' > .coveragerc-core
          python -m pytest tests/test_mapper.py tests/test_safe_xml.py tests/test_transforms.py tests/test_reverse.py tests/test_cli.py tests/test_mapping.py -v -p no:cacheprovider --cov=BODtoJSON --cov-config=.coveragerc-core --cov-report=term-missing
      - name: Assert zero runtime requires
        run: |
          python -c "import importlib.metadata as m; req=m.requires('BODtoJSON') or []; core=[r for r in req if 'extra ==' not in r]; assert core==[], core"
          pip show BODtoJSON
