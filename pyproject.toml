[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BODtoJSON"
version = "2.3.0"
authors = [
  { name = "Niraj Kakodkar" },
]
description = "Zero-dependency OAGIS BOD to Flattened JSON, NDJSON, and Schema Projection engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.urls]
"Homepage" = "https://thekakodkar.github.io/BODtoJSON/"

[tool.setuptools.packages.find]
where = ["src"]